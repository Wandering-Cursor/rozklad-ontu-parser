[project]
name = "ontu-parser"
version = "1.0.2"
description = "Parser for the Schedule of the Odessa National Technical University (ONTU) schedule website."
readme = "README.md"
authors = [
    { name = "Pavlo Pohorieltsev", email = "49622129+makisukurisu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0, <26.2.0",
    "beautifulsoup4>=4.14.3, <4.15.0",
    "httpx>=0.28.1, <0.29.0",
    "pydantic>=2.13.0, <2.14",
    "pydantic-settings>=2.13.1",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[project.urls]
"Homepage" = "https://github.com/Wandering-Cursor/rozklad-ontu-parser"
"Bug Tracker" = "https://github.com/Wandering-Cursor/rozklad-ontu-parser/issues"

[build-system]
requires = ["uv_build>=0.11.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint[spelling]>=4.0.5, <5",
    "pytest>=9.0.3, <10",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10, <1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = [
  "UP",
  "E",
  "W",
  "I",
  "C90",
  "N",
  "ANN",
  "ASYNC",
  "BLE",
  "FBT",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "FA",
  "ISC",
  "ICN",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "Q",
  "RET",
  "SLF",
  "SIM",
  "TID",
  "TCH",
  "ARG",
  "TD",
  "FIX",
  "ERA",
  "PL",
  "RUF",
]
ignore = [
  "ISC001",
  "N999",
  "ERA001",
  "RUF012",
  "FBT001",
  "FBT002",
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
