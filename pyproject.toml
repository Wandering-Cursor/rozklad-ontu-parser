[project]
name = "ontu-parser"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavlo Pohorieltsev", email = "49622129+makisukurisu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0, <26.2.0",
    "beautifulsoup4>=4.14.3, <4.15.0",
    "httpx>=0.28.1, <0.29.0",
    "pydantic>=2.13.0, <2.14",
    "pydantic-settings>=2.13.1",
    "requests>=2.33.1, <2.34.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]

[project.urls]
"Homepage" = "https://github.com/Wandering-Cursor/rozklad-ontu-parser"
"Bug Tracker" = "https://github.com/Wandering-Cursor/rozklad-ontu-parser/issues"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint[spelling]>=4.0.5, <5",
    "pytest>=9.0.3, <10",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10, <1",
]
